name: Update ETF Market Data

on:
  schedule:
    - cron: '0 8 * * 1-5' # 台灣時間週一至週五 16:00
  workflow_dispatch: # 支援手動執行

# 顯式宣告 Actions 具備寫入儲存庫內容的權限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run Data Fetcher
        run: python fetch_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data" && git push)
