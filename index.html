<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF 全方位進場策略對比儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); padding: 1.5rem; margin-bottom: 1.5rem; }
        input[type="number"], select { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; margin-top: 0.25rem; }
        label { font-weight: 500; font-size: 0.875rem; color: #4b5563; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #e5e7eb; padding: 0.75rem; text-align: left; font-size: 0.875rem; }
        th { background-color: #f9fafb; font-weight: 600; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-7xl mx-auto">

    <h1 class="text-3xl font-bold text-gray-800 mb-6">ETF 資金部署：終極四線對比儀表板</h1>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <!-- 左側：參數設定 -->
        <div class="card lg:col-span-1">
            <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2">資金與扣款參數設定</h2>
            <div class="space-y-4">
                <div>
                    <label>監控標的</label>
                    <select id="ticker" onchange="fetchData()">
                        <option value="0050.TW">0050.TW (元大台灣50)</option>
                        <option value="009816.TW">009816.TW (凱基台灣TOP50)</option>
                        <option value="006208.TW">006208.TW (富邦台50)</option>
                    </select>
                </div>
                <div>
                    <label>準備投入總資金 (元)</label>
                    <input type="number" id="cash" placeholder="例如: 880000" value="880000" oninput="runLocalBacktest()">
                </div>
                <div class="p-3 bg-gray-50 border rounded-md mt-4">
                    <label class="text-gray-700 font-bold text-sm">【智能日日扣 參數】</label>
                    <div class="mt-2 text-xs text-blue-700">🟢 常態每日扣款 (站上月線)</div>
                    <input type="number" id="baseAmt" value="3500" oninput="runLocalBacktest()">
                    <div class="mt-2 text-xs text-yellow-700">🟡 跌破月線加碼</div>
                    <input type="number" id="ma20Amt" value="4500" oninput="runLocalBacktest()">
                    <div class="mt-2 text-xs text-red-700">🔴 跌破季線重壓</div>
                    <input type="number" id="ma60Amt" value="8000" oninput="runLocalBacktest()">
                </div>
            </div>
            
            <div class="mt-6 p-4 bg-purple-50 rounded-md border border-purple-100">
                <h3 class="font-bold text-purple-800 mb-1">【金字塔戰法 參數】</h3>
                <p class="text-xs text-purple-600 mb-1">總資金將自動切分為 10 層兵力</p>
                <p class="text-sm text-gray-700">單層基準: <span id="layerValue" class="font-bold">88,000</span> 元</p>
            </div>
        </div>

        <!-- 右側：指標與決策 -->
        <div class="lg:col-span-3 space-y-6">
            <div class="card">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="p-3 bg-gray-50 rounded border">
                        <div class="text-xs text-gray-500">最新收盤價</div>
                        <div id="currentPrice" class="text-xl font-bold text-gray-800">--</div>
                    </div>
                    <div class="p-3 bg-gray-50 rounded border">
                        <div class="text-xs text-gray-500">波段回撤幅度</div>
                        <div id="drawdown" class="text-xl font-bold text-gray-800">--%</div>
                    </div>
                    <div class="p-3 bg-gray-50 rounded border">
                        <div class="text-xs text-gray-500">月線 (20MA) 狀態</div>
                        <div id="ma20Status" class="text-xl font-bold text-gray-800">--</div>
                    </div>
                    <div class="p-3 bg-gray-50 rounded border">
                        <div class="text-xs text-gray-500">季線 (60MA) 狀態</div>
                        <div id="ma60Status" class="text-xl font-bold text-gray-800">--</div>
                    </div>
                </div>

                <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2">今日策略行動指南</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="p-4 rounded-lg border-2 border-blue-200 bg-blue-50 text-center">
                        <h3 class="text-sm font-bold text-blue-700 mb-1">智能條件日扣 建議</h3>
                        <div id="smartAction" class="text-2xl font-bold text-blue-900">-- 元</div>
                    </div>
                    <div class="p-4 rounded-lg border-2 border-purple-200 bg-purple-50 text-center">
                        <h3 class="text-sm font-bold text-purple-700 mb-1">金字塔大額加倉 建議</h3>
                        <div id="pyramidAction" class="text-lg font-bold text-purple-900 mt-1">--</div>
                    </div>
                </div>
            </div>

            <!-- 圖表一：四線回測對比 -->
            <div class="card">
                <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2 flex justify-between items-center">
                    <span>進攻回測：四種建倉法終極對決 (近 5 年)</span>
                </h2>
                <div id="compareChart" style="width: 100%; height: 450px;"></div>
                <div id="backtestMetrics" class="text-sm font-bold mt-3 text-center grid grid-cols-2 md:grid-cols-4 gap-2">
                    <!-- Metrics injected via JS -->
                </div>
                <p class="text-xs text-gray-500 mt-3">* 模擬情境：假設起手握有 88 萬純現金。金字塔戰法創新高會平倉重置；智能日扣則是不斷買進直到資金用完。</p>
            </div>
            
            <!-- 圖表二：K線 -->
            <div class="card">
                <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2">近一年 K 線與均線結構</h2>
                <div id="klineChart" style="width: 100%; height: 400px;"></div>
            </div>
        </div>
    </div>

    <script>
        let compareChart = null;
        let klineChart = null;
        let globalData = null; 
        let marketData = {};

        async function getMarketData(ticker) {
            try {
                const res = await fetch(`./market_data.json?t=${new Date().getTime()}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data[ticker]) return data[ticker];
                }
            } catch(e) {}

            const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=5y`;
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
            ];

            for (let proxy of proxies) {
                try {
                    const response = await fetch(proxy);
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.chart && data.chart.result) {
                            const quote = data.chart.result[0].indicators.quote[0];
                            const timestamps = data.chart.result[0].timestamp;
                            let d = { dates: [], open: [], high: [], low: [], close: [] };
                            for(let i=0; i<timestamps.length; i++) {
                                if(quote.close[i] !== null) {
                                    d.dates.push(new Date(timestamps[i]*1000).toISOString().split('T')[0]);
                                    d.open.push(quote.open[i]); d.high.push(quote.high[i]);
                                    d.low.push(quote.low[i]); d.close.push(quote.close[i]);
                                }
                            }
                            return d;
                        }
                    }
                } catch (error) {}
            }
            throw new Error("無法取得市場數據");
        }

        async function fetchData() {
            const ticker = document.getElementById('ticker').value;
            try {
                const tData = await getMarketData(ticker);
                
                // Indicators calculation
                const calcMA = (d, data) => data.map((_, i, arr) => i < d-1 ? data[i] : +(arr.slice(i-d+1, i+1).reduce((a,b)=>a+b)/d).toFixed(2));
                const ma20 = calcMA(20, tData.close);
                const ma60 = calcMA(60, tData.close);
                
                let peak60 = [], drawdown = [], prior5High = [], rightSideBreakout = [];
                for(let i=0; i<tData.close.length; i++) {
                    let p60 = Math.max(...tData.close.slice(Math.max(0, i-59), i+1));
                    peak60.push(p60);
                    drawdown.push(((tData.close[i] - p60) / p60) * 100);

                    if (i < 5) { prior5High.push(tData.close[i]); rightSideBreakout.push(false); }
                    else {
                        let p5H = Math.max(...tData.close.slice(i-5, i));
                        prior5High.push(p5H);
                        rightSideBreakout.push(tData.close[i] > p5H);
                    }
                }

                const calcEMA = (data, p) => { let k=2/(p+1), res=[data[0]]; for(let i=1;i<data.length;i++) res.push(data[i]*k+res[i-1]*(1-k)); return res; };
                const dif = calcEMA(tData.close, 12).map((v, i) => v - calcEMA(tData.close, 26)[i]);
                const hist = dif.map((v, i) => v - calcEMA(dif, 9)[i]);
                const macdImproving = hist.map((v, i) => i === 0 ? false : v > hist[i-1]);

                globalData = { dates: tData.dates, closes: tData.close, open: tData.open, high: tData.high, low: tData.low, ma20: ma20, ma60: ma60, peak60: peak60, drawdown: drawdown, rightSideBreakout: rightSideBreakout, macdImproving: macdImproving };
                
                const lastIdx = tData.close.length - 1;
                marketData = {
                    close: tData.close[lastIdx], peak60: peak60[lastIdx], drawdown: drawdown[lastIdx], 
                    ma20: ma20[lastIdx], ma60: ma60[lastIdx], rightSideBreakout: rightSideBreakout[lastIdx], macdImproving: macdImproving[lastIdx]
                };

                updateStatusUI();
                runLocalBacktest(); 
                renderKlineChart();
                
            } catch (error) {
                console.error(error);
            }
        }

        function updateStatusUI() {
            const price = marketData.close;
            document.getElementById('currentPrice').innerText = price.toFixed(2);
            
            let ddEl = document.getElementById('drawdown');
            ddEl.innerText = marketData.drawdown.toFixed(2) + "%";
            ddEl.className = `text-xl font-bold ${marketData.drawdown <= -5 ? 'text-red-600' : 'text-gray-800'}`;

            let ma20El = document.getElementById('ma20Status');
            if (price > marketData.ma20) { ma20El.innerText = "站上月線"; ma20El.className = "text-xl font-bold text-green-600"; }
            else { ma20El.innerText = "跌破月線"; ma20El.className = "text-xl font-bold text-red-600"; }

            let ma60El = document.getElementById('ma60Status');
            if (price > marketData.ma60) { ma60El.innerText = "站上季線"; ma60El.className = "text-xl font-bold text-green-600"; }
            else { ma60El.innerText = "跌破季線"; ma60El.className = "text-xl font-bold text-red-600"; }
            
            // UI Update: Smart Action
            const baseAmt = parseFloat(document.getElementById('baseAmt').value) || 3500;
            const ma20Amt = parseFloat(document.getElementById('ma20Amt').value) || 4500;
            const ma60Amt = parseFloat(document.getElementById('ma60Amt').value) || 8000;
            
            let todayAmt = baseAmt;
            if (price < marketData.ma60) todayAmt = ma60Amt;
            else if (price < marketData.ma20) todayAmt = ma20Amt;
            document.getElementById('smartAction').innerText = todayAmt.toLocaleString() + " 元";

            // UI Update: Pyramid Action
            let pyrAction = "不動 / 等待跌幅";
            if (marketData.drawdown <= -5 && marketData.rightSideBreakout && marketData.macdImproving) {
                pyrAction = "🔥 右側確立，打滿剩餘資金";
            } else if (price < marketData.ma60 && marketData.drawdown <= -8) {
                pyrAction = "🔴 破季線，投入 3 層資金";
            } else if (price < marketData.ma20 && marketData.drawdown <= -5) {
                pyrAction = "🛡️ 破月線，投入 2 層資金";
            } else if (marketData.drawdown <= -5) {
                pyrAction = "🔵 跌 5%，投入 1 層資金";
            }
            document.getElementById('pyramidAction').innerText = pyrAction;
        }

        // 當使用者修改金額時，即時重跑回測
        function runLocalBacktest() {
            if (!globalData) return;
            
            const { closes, dates, ma20, ma60, peak60, drawdown, rightSideBreakout, macdImproving } = globalData;
            const startIdx = 200; 
            if (closes.length <= startIdx) return;
            
            const initialCap = parseFloat(document.getElementById('cash').value) || 880000;
            const baseAmt = parseFloat(document.getElementById('baseAmt').value) || 3500;
            const ma20Amt = parseFloat(document.getElementById('ma20Amt').value) || 4500;
            const ma60Amt = parseFloat(document.getElementById('ma60Amt').value) || 8000;
            
            document.getElementById('layerValue').innerText = (initialCap / 10).toLocaleString();

            let simDates = [], bhReturns = [], dcaReturns = [], smartReturns = [], pyrReturns = [];
            
            // 1. 第一天全壓 (All-in)
            let bhShares = initialCap / closes[startIdx];
            
            // 2. 傳統定額日日扣
            let dcaCash = initialCap, dcaShares = 0;
            
            // 3. 智能加碼日日扣
            let smartCash = initialCap, smartShares = 0;

            // 4. 金字塔戰法
            let pyrCash = initialCap, pyrShares = 0;
            let layerSize = pyrCash / 10;
            let lastBuyPrice = -1;

            for(let i = startIdx; i < closes.length; i++) {
                let price = closes[i];
                simDates.push(dates[i]);
                
                // --- All-in ---
                bhReturns.push((((bhShares * price) / initialCap) - 1) * 100);

                // --- Traditional DCA ---
                if (dcaCash > 0) {
                    let buyAmt = Math.min(baseAmt, dcaCash);
                    dcaShares += buyAmt / price;
                    dcaCash -= buyAmt;
                }
                dcaReturns.push((((dcaCash + (dcaShares * price)) / initialCap) - 1) * 100);

                // --- Smart DCA ---
                if (smartCash > 0) {
                    let targetAmt = baseAmt;
                    if (price < ma60[i]) targetAmt = ma60Amt;
                    else if (price < ma20[i]) targetAmt = ma20Amt;
                    
                    let buyAmt = Math.min(targetAmt, smartCash);
                    smartShares += buyAmt / price;
                    smartCash -= buyAmt;
                }
                smartReturns.push((((smartCash + (smartShares * price)) / initialCap) - 1) * 100);

                // --- Pyramid ---
                if (price >= peak60[i]) {
                    if (pyrShares > 0) {
                        pyrCash += pyrShares * price;
                        pyrShares = 0;
                        lastBuyPrice = -1;
                    }
                    layerSize = pyrCash / 10;
                }

                if (drawdown[i] <= -5 && lastBuyPrice === -1 && pyrCash >= layerSize * 1) {
                    pyrShares += (layerSize * 1) / price; pyrCash -= (layerSize * 1); lastBuyPrice = price;
                }
                if (price < ma20[i] && lastBuyPrice > 0 && price <= lastBuyPrice * 0.97 && pyrCash >= layerSize * 2) {
                    if (pyrShares > 0 && pyrShares <= ((layerSize*2.5)/price)) { 
                        pyrShares += (layerSize * 2) / price; pyrCash -= (layerSize * 2); lastBuyPrice = price;
                    }
                }
                if (price < ma60[i] && lastBuyPrice > 0 && price <= lastBuyPrice * 0.97 && pyrCash >= layerSize * 3) {
                    if (drawdown[i] <= -8) {
                        pyrShares += (layerSize * 3) / price; pyrCash -= (layerSize * 3); lastBuyPrice = price;
                    }
                }
                if (drawdown[i] <= -5 && rightSideBreakout[i] && macdImproving[i] && pyrCash > 1000) {
                    pyrShares += pyrCash / price; pyrCash = 0; lastBuyPrice = price;
                }

                pyrReturns.push((((pyrCash + (pyrShares * price)) / initialCap) - 1) * 100);
            }
            
            const fBh = bhReturns[bhReturns.length-1].toFixed(1);
            const fDca = dcaReturns[dcaReturns.length-1].toFixed(1);
            const fSmart = smartReturns[smartReturns.length-1].toFixed(1);
            const fPyr = pyrReturns[pyrReturns.length-1].toFixed(1);
            
            document.getElementById('backtestMetrics').innerHTML = `
                <div class="bg-blue-50 text-blue-700 p-2 rounded border border-blue-200">全壓基準: ${fBh}%</div>
                <div class="bg-green-50 text-green-700 p-2 rounded border border-green-200">傳統定額: ${fDca}%</div>
                <div class="bg-red-50 text-red-700 p-2 rounded border border-red-200">智能日扣: ${fSmart}%</div>
                <div class="bg-purple-50 text-purple-700 p-2 rounded border border-purple-200">金字塔: ${fPyr}%</div>
            `;
            
            renderCompareChart(simDates, bhReturns, dcaReturns, smartReturns, pyrReturns);
        }

        function renderCompareChart(dates, bhRet, dcaRet, smartRet, pyrRet) {
            if (!compareChart) compareChart = echarts.init(document.getElementById('compareChart'));
            const option = {
                tooltip: { trigger: 'axis', valueFormatter: (val) => val.toFixed(2) + '%' },
                legend: { data: ['第一天全壓 (基準)', '傳統定額日扣', '智能條件日扣', '金字塔動能加倉'], bottom: 0 },
                grid: { left: '8%', right: '8%', bottom: '15%', top: '10%' },
                xAxis: { type: 'category', data: dates, boundaryGap: false },
                yAxis: { type: 'value', axisLabel: { formatter: '{value} %' }, splitLine: { lineStyle: { type: 'dashed' } } },
                dataZoom: [{ type: 'inside' }, { type: 'slider', top: '85%' }],
                series: [
                    { name: '智能條件日扣', type: 'line', data: smartRet, showSymbol: false, lineStyle: { width: 2.5, color: '#ef4444' }, z: 10 }, 
                    { name: '金字塔動能加倉', type: 'line', data: pyrRet, showSymbol: false, lineStyle: { width: 2.5, color: '#9333ea' }, z: 9 }, 
                    { name: '傳統定額日扣', type: 'line', data: dcaRet, showSymbol: false, lineStyle: { width: 2, color: '#22c55e' }, z: 8 }, 
                    { name: '第一天全壓 (基準)', type: 'line', data: bhRet, showSymbol: false, lineStyle: { width: 1.5, color: '#3b82f6', type: 'dashed' }, z: 1 } 
                ]
            };
            compareChart.setOption(option);
        }

        function renderKlineChart() {
            if (!klineChart) klineChart = echarts.init(document.getElementById('klineChart'));
            
            let ohlc = [];
            for(let i=0; i<globalData.dates.length; i++) {
                ohlc.push([globalData.open[i], globalData.closes[i], globalData.low[i], globalData.high[i]]);
            }

            let markAreaData = [
                { yAxis: marketData.peak60 * 0.95, itemStyle: { color: 'rgba(59, 130, 246, 0.1)' }, label: { show: true, position: 'insideTopLeft', formatter: '階梯一: 跌破 5%', color: '#1d4ed8' }},
                { yAxis: marketData.ma20, itemStyle: { color: 'rgba(234, 179, 8, 0.1)' }, label: { show: true, position: 'insideTopLeft', formatter: '階梯二: 月線', color: '#a16207' }},
                { yAxis: marketData.ma60, itemStyle: { color: 'rgba(249, 115, 22, 0.1)' }, label: { show: true, position: 'insideTopLeft', formatter: '階梯三: 季線', color: '#c2410c' }}
            ];

            const option = {
                tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                legend: { data: ['日K線', '月線', '季線'], bottom: 0 },
                grid: { left: '8%', right: '8%', bottom: '15%', top: '5%' },
                xAxis: { type: 'category', data: globalData.dates, scale: true, boundaryGap: false, splitLine: { show: false } },
                yAxis: { scale: true, splitArea: { show: true } },
                dataZoom: [{ type: 'inside', start: 60, end: 100 }, { show: true, type: 'slider', top: '85%', start: 60, end: 100 }],
                series: [
                    { name: '日K線', type: 'candlestick', data: ohlc, itemStyle: { color: '#ef4444', color0: '#22c55e', borderColor: '#ef4444', borderColor0: '#22c55e' } },
                    { name: '月線', type: 'line', data: globalData.ma20, smooth: true, showSymbol: false, lineStyle: { width: 1.5, color: '#eab308' } },
                    { name: '季線', type: 'line', data: globalData.ma60, smooth: true, showSymbol: false, lineStyle: { width: 2, color: '#3b82f6' } }
                ]
            };
            klineChart.setOption(option);
        }

        window.addEventListener('resize', function() { if (klineChart) klineChart.resize(); if (compareChart) compareChart.resize(); });
        window.onload = fetchData;
    </script>
</body>
</html>
